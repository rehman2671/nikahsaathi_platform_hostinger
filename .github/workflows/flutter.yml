name: Flutter contract checks

on:
  push:
    paths:
      - "clients/flutter/**"
      - ".github/workflows/flutter.yml"
  pull_request:
    paths:
      - "clients/flutter/**"
      - ".github/workflows/flutter.yml"

jobs:
  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.1"
          channel: "stable"
          cache: true
      - run: flutter pub get
      - run: dart analyze
      - run: flutter test
      - run: dart run tool/compile_smoke.dart
